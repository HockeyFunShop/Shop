<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<title>Hockey Fun Shop — Local 3D-Printed Hockey Gear</title>
<meta name="description" content="3D-printed hockey gear and gifts, made locally by Hockey Fun Shop.">
<!-- Umami analytics (cookieless). Click tracking: any element with data-umami-event -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="7670d432-6574-4361-a8b8-7b7c71e02181"></script>
<style>
  :root{
    /* Palette 4b "Lime & Ice" — logo keeps its own rink colors */
    --navy:#0f2742; --lime:#c6ff00; --iceblue:#4cc9f0; --ice:#f4f8fb;
    --line:#d9e3ec; --muted:#5b6b7c; --card:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--ice);color:var(--navy);line-height:1.5}
  header{background:#fff;padding:18px 20px}
  .brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand svg{width:150px;height:auto;flex-shrink:0}
  header h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(1.9rem,6vw,2.8rem);letter-spacing:1px;line-height:1.05}
  .band{background:var(--lime);color:var(--navy);font-weight:800;padding:10px 20px;letter-spacing:.5px}
  .wrap{max-width:1000px;margin:0 auto}
  .notice{background:#e6f7fd;border:1px solid var(--iceblue);color:var(--navy);padding:10px 14px;border-radius:8px;margin:20px 0 0;font-size:.95rem}
  main{padding:24px 20px 48px}
  h2{font-size:1.3rem;margin:8px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .photo{aspect-ratio:1/1;background:#eaf1f7;display:flex;align-items:center;justify-content:center;position:relative}
  .photo img{width:100%;height:100%;object-fit:cover}
  .photo .ph{font-size:.85rem;color:var(--muted);position:absolute;bottom:10px;left:0;right:0;text-align:center}
  .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .body h3{margin:0;font-size:1.2rem}
  .desc{margin:0;color:#2c3e50}
  .facts{margin:0;padding-left:18px;color:var(--muted);font-size:.95rem}
  .opt-label{font-weight:600;font-size:.9rem;margin-top:4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--line);background:var(--ice);border-radius:999px;padding:6px 12px;font-size:.9rem;font-family:inherit;color:inherit;cursor:pointer}
  .opt.sel{border-color:var(--navy);background:var(--navy);color:var(--lime)}
  .opt.sel small{color:#e8ffad}
  .opt small{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:.9rem;padding:24px 20px 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="wrap brand">
    <svg viewBox="0 0 400 220" role="img" aria-label="Hockey Fun Shop rink logo">
      <rect x="10" y="10" width="380" height="200" rx="80" fill="#f4f8fb" stroke="#0f2742" stroke-width="8"/>
      <line x1="200" y1="14" x2="200" y2="206" stroke="#c8102e" stroke-width="6"/>
      <line x1="138" y1="14" x2="138" y2="206" stroke="#1f5fa8" stroke-width="6"/>
      <line x1="262" y1="14" x2="262" y2="206" stroke="#1f5fa8" stroke-width="6"/>
      <line x1="44" y1="44" x2="44" y2="176" stroke="#c8102e" stroke-width="3"/>
      <line x1="356" y1="44" x2="356" y2="176" stroke="#c8102e" stroke-width="3"/>
      <path d="M44 92 A18 18 0 0 1 44 128 Z" fill="#9cc3ea"/>
      <path d="M356 92 A18 18 0 0 0 356 128 Z" fill="#9cc3ea"/>
      <circle cx="200" cy="110" r="48" fill="#ffffff" stroke="#1f5fa8" stroke-width="5"/>
      <text x="200" y="122" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="42" fill="#0f2742">HFS</text>
      <rect x="177" y="130" width="46" height="4" rx="2" fill="#c8102e"/>
    </svg>
    <h1>HOCKEY FUN SHOP</h1>
  </div>
</header>
<div class="band"><div class="wrap">3D PRINTED • SWAG • GEAR</div></div>

<main class="wrap">
  <div class="notice">Preview page — more products, photos, and ordering info coming soon.</div>

  <h2 style="margin-top:24px">Products</h2>
  <div class="grid" id="products"></div>
</main>

<footer>
  <div class="wrap">Ordering &amp; contact info coming soon.</div>
</footer>

<script>
/* ===== PRODUCT LIST — edit here =====
   photo: path to an image in the images/ folder (leave "" to show the placeholder drawing)
   price: leave "" to hide the price                                                        */
const PRODUCTS = [
  {
    name: "Airless Hockey-Stick Ball",
    photo: "",
    price: "",
    description: "A one-piece, airless ball printed in flexible TPU, with 42 hockey-stick shaped cutouts.",
    facts: ["About 65 mm (2.6 in) across", "Flexible TPU", "One solid piece — nothing to inflate"],
    optionsLabel: "Styles",
    options: [
      { name: "Solid", note: "one color" },
      { name: "Striped", note: "black + one color, 5 bands" }
    ]
  }
];

/* Placeholder drawing used until a real photo is added */
const BALL_SVG = `
<svg viewBox="0 0 200 200" width="62%" aria-hidden="true">
  <defs><radialGradient id="g" cx="38%" cy="32%" r="75%">
    <stop offset="0" stop-color="#ff5a6e"/><stop offset="1" stop-color="#a00d24"/></radialGradient></defs>
  <circle cx="100" cy="100" r="88" fill="url(#g)"/>
  ${[[70,62,-30],[118,58,25],[150,98,70],[52,104,-80],[96,104,10],[128,142,40],[74,146,-20]]
    .map(([x,y,r])=>`<g transform="translate(${x} ${y}) rotate(${r})">
      <path d="M-3 -20 L3 -20 L3 8 L14 8 Q18 8 18 12 L18 14 L-3 14 Z" fill="#5c0614" opacity=".85"/></g>`).join("")}
</svg>`;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

document.getElementById("products").innerHTML = PRODUCTS.map(p => `
  <article class="card">
    <div class="photo" data-umami-event="Product photo" data-umami-event-product="${esc(p.name)}">
      ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">`
                : `${BALL_SVG}<span class="ph">Photo coming soon</span>`}
    </div>
    <div class="body">
      <h3>${esc(p.name)}</h3>
      ${p.price ? `<div style="font-weight:700;color:var(--navy)">${esc(p.price)}</div>` : ""}
      <p class="desc">${esc(p.description)}</p>
      ${p.facts?.length ? `<ul class="facts">${p.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${p.options?.length ? `<div class="opt-label">${esc(p.optionsLabel||"Options")}</div>
        <div class="opts">${p.options.map(o=>`<button type="button" class="opt" data-umami-event="Option" data-umami-event-product="${esc(p.name)}" data-umami-event-option="${esc(o.name)}">${esc(o.name)}${o.note?` <small>— ${esc(o.note)}</small>`:""}</button>`).join("")}</div>` : ""}
    </div>
  </article>`).join("");

/* Highlight the tapped option (one per product) */
document.addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  b.parentElement.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
});
</script>
</body>
</html>
